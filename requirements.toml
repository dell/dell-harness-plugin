# requirements.toml — Enterprise MCP server governance
# Deployed to /etc/codex/requirements.toml via image bake or K8s ConfigMap.
# Only MCP servers listed here can be enabled. Unlisted servers are blocked.
#
# Reference: https://developers.openai.com/codex/enterprise/managed-configuration

# Allowed MCP servers (by identity)


[mcp_servers.jira-cec]
identity = { url = "https://mcp.example.com/atlassian" }

[mcp_servers.github-enterprise]
identity = { url = "https://mcp.example.com/github/isg" }

# Dev Spaces MCP server (plugin-bundled stdio adapter)
[mcp_servers.dell_devspaces]
identity = { command = "python" }

# AIDP MCP servers (stdio, Docker-based)
[mcp_servers.aidp_elasticsearch]
identity = { command = "docker" }

[mcp_servers.aidp_trino]
identity = { command = "docker" }

[mcp_servers.sharepoint]
identity = { command = "docker" }

# Dell Data Orchestration Engine MCP server (plugin-bundled stdio launcher)
[mcp_servers.dell_dataloop]
identity = { command = "python" }

# Codex feature constraints
[features]
hooks = true
chronicle = false

# Allowed approval policies
allowed_approval_policies = ["on-request", "unless-allow-listed"]

# Allowed sandbox modes
allowed_sandbox_modes = ["workspace-write", "read-only"]
