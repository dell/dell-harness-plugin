#
# gitleaks configuration. Uses the default ruleset; the allowlist covers only
# deliberately fake values that tests use to prove secrets are redacted, and
# generated validation evidence whose SHA-256 file hashes look like API keys.

[extend]
useDefault = true

[allowlist]
description = "Synthetic secret-shaped test fixtures"
regexTarget = "line"
regexes = [
  '''customer-secret-value''',
  '''ApiKey <encoded-api-key>''',
]
paths = [
  '''(^|/)validation/evidence/summary\.json$''',
]

[[rules]]
id = "generic-api-key"
[[rules.allowlists]]
description = "SHA-256 source hashes in the Windows review manifest, not credentials"
condition = "AND"
paths = ['''^evals/results/windows-review-20261109/manifest\.json$''']
regexTarget = "line"
regexes = ['''^\s*"[a-zA-Z0-9_./-]+\.py": "[a-f0-9]{64}",?\s*$''']
