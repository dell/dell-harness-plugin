name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: Skills, packaging, evals, release hygiene (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.txt
      - name: Lint skills
        run: python scripts/validate_skills.py
      - name: Repository-wide tests
        run: python -m pytest tests -q

  devspaces:
    name: Dell AI Factory Agentic Workspace plugin
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: |
          python -m venv .venv-devspaces
          .venv-devspaces/bin/pip install -r dell-ai-factory-agentic-workspace/requirements-dev.txt
      - run: .venv-devspaces/bin/python -m pytest dell-ai-factory-agentic-workspace/tests -q
      - run: .venv-devspaces/bin/python dell-ai-factory-agentic-workspace/scripts/validate_plugin.py --output "$RUNNER_TEMP/evidence"

  data-orchestration:
    name: Data Orchestration Engine MCP server
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: |
          python -m venv .venv-doe
          .venv-doe/bin/pip install -e "dell-data-orchestration-engine/mcp-server[dev]"
      - working-directory: dell-data-orchestration-engine/mcp-server
        run: ../../.venv-doe/bin/python -m pytest -q

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 \
            detect --source /repo --config /repo/.gitleaks.toml --redact --no-banner

  reuse:
    name: REUSE compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: fsfe/reuse-action@v5
